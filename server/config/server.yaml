# lars15 config — one server + LiveKit; panel data straight from the gateway.
hermes:
  base_url: http://127.0.0.1:8642   # standalone gateway (hermes gateway run|install)
  api_key_env: API_SERVER_KEY
  profile_session: lars
  timeout: 240

livekit:
  engine_mode: cloud                 # local | cloud  (or env LIVEKIT_ENGINE_MODE)
  local_ws_url: ws://127.0.0.1:7880  # livekit-server --dev (local mode)
  cloud_ws_url: wss://lars-2njzgafy.livekit.cloud

voice:
  provider: deepgram                 # deepgram | fishaudio | groq | deepinfra | elevenlabs | local
  model: aura-asteria-en             # Aura-2 is permission-locked on this project (403)
  sample_rate: 16000

stt:                                 # LOCAL engine fallback build
  model: base.en                     # small.en too slow on 2 cores; tune later
  device: cpu
  compute_type: int8

server:
  host: 0.0.0.0
  port: 8646                         # 8646+ is outside gateway default-platform ports
